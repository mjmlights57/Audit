<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2538"><title>EWPros Timesheets</title><link rel="stylesheet" href="time.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">EWPros</p><h1>Timesheets</h1><p>Enter daily project hours for approval.</p></div><button id="logout" class="secondary hidden" type="button">Sign out</button></header>
<section id="loginPanel" class="card"><h2>Worker sign in</h2><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Timesheet PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="loginError" class="error"></p></section>
<section id="portal" class="hidden"><div class="welcome card"><h2 id="workerName"></h2><p>Your submitted hours go to EWPros for approval and project costing.</p></div><section class="card"><h2>Enter time</h2><form id="timeForm"><label>Date<input name="work_date" type="date" required></label><label>Project<select name="project_id" id="project"><option value="">No project</option></select></label><label>Business line<select name="business_line_id" id="businessLine" required></select></label><div class="hours"><label>Regular hours<input name="regular_hours" type="number" step="0.25" min="0" max="24" value="0"></label><label>Overtime<input name="overtime_hours" type="number" step="0.25" min="0" max="24" value="0"></label></div><label>Notes<input name="notes"></label><button type="submit">Submit time</button><p id="formMessage" class="message"></p></form></section><section class="card"><h2>Recent entries</h2><div id="entries" class="table-wrap"></div></section></section>
</main><script src="time.js"></script></body></html>
